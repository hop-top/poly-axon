host: copilot
mappings:
  - native:
      - -p/--prompt <text>
    support: native
    universal: ModeRun
  - native:
      - (default)
      - -i/--interactive <prompt>
    support: native
    universal: ModeInteractive
  - native:
      - --resume=<id>
    support: native
    universal: ModeResume
  - native:
      - --continue
    support: native
    universal: Continue
  - support: unsupported
    universal: Fork
  - native:
      - CommandSpec.Dir
    notes: no --cd / --dir flag
    support: native
    universal: CWD
  - native:
      - --model
    support: native
    universal: Model
  - native:
      - --agent
    support: native
    universal: Agent
  - native:
      - (default)
    support: native
    universal: OutputText
  - native:
      - --output-format json
    notes: JSONL one-object-per-line; caller must reduce
    support: shim
    universal: OutputJSON
  - native:
      - --output-format json
    support: native
    universal: OutputStreamJSON
  - notes: no per-tier sandbox; use tool/url policy via Config
    support: unsupported
    universal: SandboxReadOnly
  - support: unsupported
    universal: SandboxWorkspaceWrite
  - native:
      - --yolo
    notes: requires Config["uxp.allow_dangerous"]="true"
    support: dangerous
    universal: SandboxDangerFullAccess
  - native:
      - (default)
    support: native
    universal: ApprovalAsk
  - support: unsupported
    universal: ApprovalPlan
  - notes: 'refused: no native auto-edit; would degrade to dangerous bypass'
    support: unsupported
    universal: ApprovalAutoEdit
  - native:
      - --yolo
      - --allow-all
      - --allow-all-tools
    notes: requires Config["uxp.allow_dangerous"]="true"
    support: dangerous
    universal: ApprovalAutoAll
  - support: unsupported
    universal: ApprovalNever
  - native:
      - --add-dir <directory> (repeatable)
    support: native
    universal: AddDirs
  - native:
      - S-1+S-3 (parent-dir reduce → --add-dir + prompt-block)
    support: shim
    universal: Files
  - native:
      - S-3 (prompt-block)
    notes: no headless image flag
    support: shim
    universal: Images
tools:
  - controllable: true
    native_names:
      - shell
    notes: subject to --allow-tool='shell(...)' and --deny-tool='shell(...)' policy
    permission: exec
    support: native
    transcript: native
    universal: shell.exec
  - controllable: true
    native_names:
      - read
    permission: read
    support: native
    transcript: native
    universal: file.read
  - controllable: true
    native_names:
      - write
    permission: write
    support: native
    transcript: native
    universal: file.write
  - controllable: true
    native_names:
      - edit
    permission: write
    support: native
    transcript: native
    universal: file.edit
  - controllable: true
    native_names:
      - search
    permission: read
    support: native
    transcript: native
    universal: file.search
  - controllable: false
    notes: via plugins/MCP, not built-in
    permission: network
    support: shim
    transcript: unavailable
    universal: web.search
  - controllable: true
    native_names:
      - fetch
    notes: subject to --allow-url / --deny-url policy
    permission: network
    support: native
    transcript: native
    universal: web.fetch
  - controllable: false
    permission: task
    support: unsupported
    transcript: unavailable
    universal: todo.write
  - controllable: false
    permission: task
    support: unsupported
    transcript: unavailable
    universal: task.spawn
  - controllable: false
    permission: task
    support: unsupported
    transcript: unavailable
    universal: plan.update
  - controllable: true
    native_names:
      - MCP
      - github-mcp-server
    notes: built-in github-mcp-server; --add-github-mcp-tool / --add-github-mcp-toolset / --additional-mcp-config to extend
    permission: exec
    support: native
    transcript: native
    universal: mcp.call
  - controllable: false
    notes: no headless image flag
    permission: read
    support: unsupported
    transcript: unavailable
    universal: image.read
  - controllable: false
    permission: browser
    support: unsupported
    transcript: unavailable
    universal: browser.operate
  - controllable: true
    native_names:
      - ask_user
    notes: disable via --no-ask-user for fully-autonomous runs
    permission: task
    support: native
    transcript: native
    universal: user.message
