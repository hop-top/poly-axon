host: crush
mappings:
  - native:
      - crush run [prompt...]
    support: native
    universal: ModeRun
  - native:
      - crush
    support: native
    universal: ModeInteractive
  - native:
      - crush run --session <id>
    support: native
    universal: ModeResume
  - native:
      - crush run --continue
    support: native
    universal: Continue
  - support: unsupported
    universal: Fork
  - native:
      - --cwd / -c
    support: native
    universal: CWD
  - native:
      - --model
    support: native
    universal: Model
  - support: unsupported
    universal: Agent
  - native:
      - (default)
    support: native
    universal: OutputText
  - notes: no --format flag exists
    support: unsupported
    universal: OutputJSON
  - support: unsupported
    universal: OutputStreamJSON
  - support: unsupported
    universal: SandboxReadOnly
  - support: unsupported
    universal: SandboxWorkspaceWrite
  - native:
      - --yolo / -y
    support: dangerous
    universal: SandboxDangerFullAccess
  - native:
      - (default)
    support: native
    universal: ApprovalAsk
  - support: unsupported
    universal: ApprovalPlan
  - notes: --yolo is auto-all only; refused per anti-shim
    support: unsupported
    universal: ApprovalAutoEdit
  - native:
      - --yolo / -y
    support: dangerous
    universal: ApprovalAutoAll
  - support: unsupported
    universal: ApprovalNever
  - native:
      - S-3 (prompt-block)
    support: shim
    universal: AddDirs
  - native:
      - S-3 (prompt-block)
    support: shim
    universal: Files
  - native:
      - S-3 (prompt-block)
    support: shim
    universal: Images
tools:
  - controllable: false
    native_names:
      - bash
    permission: exec
    support: native
    transcript: native
    universal: shell.exec
  - controllable: false
    permission: read
    support: native
    transcript: native
    universal: file.read
  - controllable: false
    permission: write
    support: native
    transcript: native
    universal: file.write
  - controllable: false
    permission: write
    support: native
    transcript: native
    universal: file.edit
  - controllable: false
    permission: read
    support: shim
    transcript: unavailable
    universal: file.search
  - controllable: false
    permission: network
    support: unsupported
    transcript: unavailable
    universal: web.search
  - controllable: false
    permission: network
    support: unsupported
    transcript: unavailable
    universal: web.fetch
  - controllable: false
    permission: task
    support: unsupported
    transcript: unavailable
    universal: todo.write
  - controllable: false
    permission: task
    support: unsupported
    transcript: unavailable
    universal: task.spawn
  - controllable: false
    permission: task
    support: unsupported
    transcript: unavailable
    universal: plan.update
  - controllable: false
    notes: MCP support via crush config
    permission: exec
    support: shim
    transcript: unavailable
    universal: mcp.call
  - controllable: false
    permission: read
    support: unsupported
    transcript: unavailable
    universal: image.read
  - controllable: false
    permission: browser
    support: unsupported
    transcript: unavailable
    universal: browser.operate
  - controllable: false
    permission: task
    support: unsupported
    transcript: unavailable
