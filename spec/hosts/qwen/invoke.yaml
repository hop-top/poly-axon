host: qwen
mappings:
  - native:
      - qwen [query..]
    notes: positional; -p/--prompt is documented as deprecated
    support: native
    universal: ModeRun
  - native:
      - qwen [query..]
      - -i/--prompt-interactive
    support: native
    universal: ModeInteractive
  - native:
      - -r/--resume <id>
    support: native
    universal: ModeResume
  - native:
      - -c/--continue
    support: native
    universal: Continue
  - support: unsupported
    universal: Fork
  - native:
      - CommandSpec.Dir
    support: native
    universal: CWD
  - native:
      - -m/--model
    support: native
    universal: Model
  - support: unsupported
    universal: Agent
  - native:
      - (default)
    support: native
    universal: OutputText
  - native:
      - -o/--output-format json
    support: native
    universal: OutputJSON
  - native:
      - -o/--output-format stream-json
    support: native
    universal: OutputStreamJSON
  - native:
      - --approval-mode plan
    support: shim
    universal: SandboxReadOnly
  - native:
      - -s/--sandbox (boolean)
    support: shim
    universal: SandboxWorkspaceWrite
  - native:
      - -y/--yolo
    support: dangerous
    universal: SandboxDangerFullAccess
  - native:
      - (default)
    support: native
    universal: ApprovalAsk
  - native:
      - --approval-mode plan
    support: native
    universal: ApprovalPlan
  - native:
      - --approval-mode auto-edit
    support: native
    universal: ApprovalAutoEdit
  - native:
      - --approval-mode yolo
      - -y/--yolo
    support: dangerous
    universal: ApprovalAutoAll
  - support: unsupported
    universal: ApprovalNever
  - native:
      - --include-directories <dir> (alias --add-dir; repeatable or comma-list)
    support: native
    universal: AddDirs
  - native:
      - S-1+S-3 (parent-dir reduce → --include-directories + prompt-block)
    support: shim
    universal: Files
  - native:
      - S-3 (prompt-block)
    support: shim
    universal: Images
tools:
  - controllable: true
    native_names:
      - shell
    notes: controllable via --allowed-tools / --core-tools / --exclude-tools
    permission: exec
    support: native
    transcript: native
    universal: shell.exec
  - controllable: true
    native_names:
      - read_file
    permission: read
    support: native
    transcript: native
    universal: file.read
  - controllable: true
    native_names:
      - write_file
    permission: write
    support: native
    transcript: native
    universal: file.write
  - controllable: true
    native_names:
      - edit_file
    permission: write
    support: native
    transcript: native
    universal: file.edit
  - controllable: true
    native_names:
      - search_file_content
      - glob
    permission: read
    support: native
    transcript: native
    universal: file.search
  - controllable: false
    notes: via extensions/MCP
    permission: network
    support: shim
    transcript: unavailable
    universal: web.search
  - controllable: false
    notes: via extensions/MCP
    permission: network
    support: shim
    transcript: unavailable
    universal: web.fetch
  - controllable: false
    permission: task
    support: unsupported
    transcript: unavailable
    universal: todo.write
  - controllable: false
    permission: task
    support: unsupported
    transcript: unavailable
    universal: task.spawn
  - controllable: false
    notes: use --approval-mode plan for plan-mode runs
    permission: task
    support: unsupported
    transcript: unavailable
    universal: plan.update
  - controllable: true
    native_names:
      - MCP
    notes: managed via qwen mcp; --allowed-mcp-server-names for scoping
    permission: exec
    support: native
    transcript: native
    universal: mcp.call
  - controllable: false
    notes: no headless image flag
    permission: read
    support: shim
    transcript: unavailable
    universal: image.read
  - controllable: false
    permission: browser
    support: unsupported
    transcript: unavailable
    universal: browser.operate
  - controllable: false
    permission: task
    support: unsupported
    transcript: unavailable
    universal: user.message
