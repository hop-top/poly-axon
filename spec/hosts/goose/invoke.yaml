host: goose
mappings:
  - native:
      - goose run -t <text>
    support: native
    universal: ModeRun
  - native:
      - goose session
    support: native
    universal: ModeInteractive
  - native:
      - goose run --resume --session-id <id>
    support: native
    universal: ModeResume
  - native:
      - goose run --resume
    notes: without --session-id resumes most recent
    support: native
    universal: Continue
  - native:
      - goose session --resume --fork
    notes: fork uses session subcommand, not run
    support: native
    universal: Fork
  - native:
      - CommandSpec.Dir
    notes: no --cd flag
    support: native
    universal: CWD
  - native:
      - --model <name>
    support: native
    universal: Model
  - native:
      - --recipe <name> (S-5)
    notes: goose recipes are richer than agents; use Config[goose.recipe_params] / [goose.sub_recipe]
    support: shim
    universal: Agent
  - native:
      - (default)
    support: native
    universal: OutputText
  - native:
      - --output-format json
    support: native
    universal: OutputJSON
  - native:
      - --output-format stream-json
    support: native
    universal: OutputStreamJSON
  - notes: configured globally via goose configure
    support: unsupported
    universal: SandboxReadOnly
  - support: unsupported
    universal: SandboxWorkspaceWrite
  - support: unsupported
    universal: SandboxDangerFullAccess
  - native:
      - (default)
    support: native
    universal: ApprovalAsk
  - support: unsupported
    universal: ApprovalPlan
  - support: unsupported
    universal: ApprovalAutoEdit
  - support: unsupported
    universal: ApprovalAutoAll
  - support: unsupported
    universal: ApprovalNever
  - native:
      - S-3 (prompt-block)
    support: shim
    universal: AddDirs
  - native:
      - S-3 (prompt-block)
    support: shim
    universal: Files
  - native:
      - S-3 (prompt-block)
    support: shim
    universal: Images
tools:
  - controllable: true
    native_names:
      - developer__shell
    notes: via developer extension; --container <id> for sandboxed execution
    permission: exec
    support: native
    transcript: native
    universal: shell.exec
  - controllable: true
    native_names:
      - developer__text_editor
    permission: read
    support: native
    transcript: native
    universal: file.read
  - controllable: true
    native_names:
      - developer__text_editor
    permission: write
    support: native
    transcript: native
    universal: file.write
  - controllable: true
    native_names:
      - developer__text_editor
    permission: write
    support: native
    transcript: native
    universal: file.edit
  - controllable: false
    notes: via shell rg/find/grep
    permission: read
    support: shim
    transcript: unavailable
    universal: file.search
  - controllable: false
    notes: via extensions
    permission: network
    support: shim
    transcript: unavailable
    universal: web.search
  - controllable: false
    notes: via extensions
    permission: network
    support: shim
    transcript: unavailable
    universal: web.fetch
  - controllable: false
    permission: task
    support: unsupported
    transcript: unavailable
    universal: todo.write
  - controllable: false
    notes: sub-recipes are pre-orchestrated, not in-conversation spawn
    permission: task
    support: unsupported
    transcript: unavailable
    universal: task.spawn
  - controllable: false
    permission: task
    support: unsupported
    transcript: unavailable
    universal: plan.update
  - controllable: true
    native_names:
      - MCP
    notes: extensive MCP support; goose mcp subcommand and --with-extension / --with-streamable-http-extension flags
    permission: exec
    support: native
    transcript: native
    universal: mcp.call
  - controllable: false
    permission: read
    support: unsupported
    transcript: unavailable
    universal: image.read
  - controllable: false
    permission: browser
    support: unsupported
    transcript: unavailable
    universal: browser.operate
  - controllable: false
    permission: task
    support: unsupported
    transcript: unavailable
    universal: user.message
