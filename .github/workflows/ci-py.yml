name: CI (Python)

on:
  push:
    branches: [main]
    # py/ packages the spec/ tree via hatchling force-include, so a
    # spec/ change can break it even with no py/ diff.
    paths: ["py/**", "spec/**", "mise.toml", "Makefile", ".github/workflows/ci-py.yml"]
  pull_request:
    branches: [main]
    paths: ["py/**", "spec/**", "mise.toml", "Makefile", ".github/workflows/ci-py.yml"]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # >>> kit-managed: toolchain >>>
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: mise run install
      # <<< kit-managed: toolchain <<<

      - name: Run py tests
        run: make test-py
